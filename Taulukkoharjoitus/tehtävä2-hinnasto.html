<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tehtävä 2</title>
</head>

<body>
    <table border="1">
        <caption>Tuotehinnasto</caption>
        <thead>
            <tr>
                <th scope="col">Tuote</th>
                <th scope="col">Hinta</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td scope="row">Vasara</td>
                <td scope="row">10€</td>
            </tr>
            <tr>
                <td scope="row">Ruuvimeisseli</td>
                <td scope="row">5€</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th scope="row">Yhteensä</th>
                <td>15€</td>
            </tr>
        </tfoot>
    </table>
</body>

</html>
