<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/tyylit.css">
    <title>CSS-harjoitusta 2</title>
</head>

<body>
    <main>

        <section class="pricing">

            <h1>Tuotteet</h1>
            <article class="pricing-card">
                <h2>Liikkumakone</h2>
                <p class="price">200€</p>
                <ul>
                    <li>Lentää</li>
                    <li>Ajaa</li>
                    <li>Ui</li>
                </ul>
                <button>Osta</button>
            </article>

            <article class="pricing-card">
                <h2>Aikakone</h2>
                <p class="price">400€</p>
                <ul>
                    <li>Liikkuu</li>
                    <li>On</li>
                    <li>Loppuu</li>
                </ul>
                <button>Osta</button>
            </article>

            <article class="pricing-card">
                <h2>Lapio</h2>
                <p class="price">20€</p>
                <ul>
                    <li>Kaivaa</li>
                    <li>Kolisee</li>
                    <li>Kaivaa kuopan niin syvälle, että sieltä ei näe enää taivasta ollenkaan</li>
                    <li>Pysyy käsissä</li>
                </ul>
                <button>Osta</button>
            </article>

        </section>
    </main>
</body>

</html>
