<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktiivinen kortti</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <main>
        <h1>Interaktiivinen kortti</h1>
        <section>
            <a class="card" href="#">
                <h2>Kortti 1</h2>
                <p>Vie hiiri päälle tai siirry Tab-näppäimellä.</p>
            </a>
            <a class="card" href="#">
                <h2>Kortti 2</h2>
                <p>Toinen kortti, jotta näet kun focus on kohdilla</p>
            </a>
        </section>

        <section>
            <h2>Animaatiot</h2>

            <div class="spinner" role="status" aria-label="Ladataan"></div>

            <div class="panel">
                <h3>Paneeli</h3>
                <p>Tulee näkyviin, kun sivu latautuu.</p>
            </div>

            <p class="notice">Sinulla on uusi ilmoitus.</p>
        </section>
    </main>
</body>

</html>
