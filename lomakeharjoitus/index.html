<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Lomakeharjoitus</title>
</head>

<body>
    <main>
        <h1>Rekisteröidy</h1>

        <form>
            <div class="field">
                <label for="name">Nimi</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="field">
                <label for="email">Sähköposti</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="field">
                <label for="password">Salasana</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="field">
                <label for="password-repeat">Salasanan vahvistus</label>
                <input type="password" id="password-repeat" name="password-repeat" required>
            </div>
            <div class="field">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">Hyväksyn ehdot</label>
            </div>
            <button type="submit">Luo tili</button>
        </form>
    </main>
</body>

</html>
