<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Lähetä viesti</title>
</head>

<body>
    <h1>Lähetä minulle viesti!</h1>
    <form>
        <label for="name">Nimi:</label>
        <input type="text" id="name" name="name" autocomplete="name" required><br><br>

        <label for="email">Sähköposti:</label>
        <input type="email" id="email" name="email" autocomplete="email" required><br><br>

        <label for="message">Viesti:</label><br>
        <textarea id="message" name="message" rows="4" cols="50" autocomplete="off" placeholder="Kirjoita minulle..."
            required></textarea><br><br>

        <button type="submit">Lähetä viesti</button>
    </form>
    <br>
    <h2>Takaisin <a href="index.html">Etusivulle</a></h2>
</body>

</html>
